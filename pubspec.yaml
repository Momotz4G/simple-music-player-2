name: simple_music_player_2
description: "A new modern Flutter music player."
publish_to: 'none'
version: 2.6.9+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  just_audio_windows:

  # Metadata
  metadata_god: 1.1.0
  
  # Discord
  flutter_discord_rpc: ^1.0.0
  
  # Tools
  shared_preferences: ^2.2.2
  path: ^1.9.0
  file_picker: ^10.3.10
  package_info_plus: ^8.0.0

  # Parsing HTTP
  http: ^1.0.0
  html: ^0.15.0

  # Video Player
  video_player: ^2.8.1
  
  # UI
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0
  provider: ^6.1.5+1
  envied: ^0.5.4+1
  video_player_win: ^3.2.2
  scrollable_positioned_list:
  palette_generator: ^0.3.3
  bitsdojo_window: ^0.1.5
  window_manager: ^0.3.9
  tray_manager: ^0.2.3

  # Shareable Card for stats
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.2 #temporary save image

  # Online Stream
  # youtube_explode_dart: ^2.5.3 #To hunt for audio on YouTube without an API key.
  soundcloud_explode_dart: ^1.1.0
  just_audio_media_kit: # Forked for WASAPI exclusive mode support
    path: packages/just_audio_media_kit_fork
  media_kit: ^1.1.0
  media_kit_libs_video: ^1.0.0

  # Youtube Parser
  permission_handler: ^11.0.0
  youtube_explode_dart: ^2.5.0
  flutter_local_notifications: ^17.0.0
  # flutter_ffmpeg: ^0.4.2 # 🚀 FFmpeg (Incompatible with AGP 8.x - missing namespace)

  # Utilities
  uuid: ^4.3.3
  ffi: ^2.1.0
  logging: ^1.2.0
  rxdart: ^0.27.7
  audio_session: ^0.1.18

  # Databases
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1 # For multi-platform
  smtc_windows: ^1.1.0
  windows_taskbar: ^1.1.2

  # Firebase
  # Firebase REMOVED for PocketBase Migration
  # firebase_core: ^3.0.0
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0
  device_info_plus: ^12.3.0
  crypto: ^3.0.7
  intl: 0.20.2
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  pocketbase: ^0.23.0+1
  ffmpeg_kit_flutter_new_audio: ^2.0.0
  open_filex: ^4.4.0  # For auto-installing APK updates
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Isar Database
  build_runner: ^2.4.13       # Runs the code generator
  isar_generator: ^3.1.0+1    # Generates the database code
  envied_generator: ^0.5.4+1
  
  # Icon Generator
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  # Pin flutter_rust_bridge to 2.11.1 to match smtc_windows and flutter_discord_rpc codegen
  flutter_rust_bridge: 2.11.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_source.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon_source.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/binaries/
    - assets/avatars/
